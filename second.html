 <!-- border => to create lines around the table 
 cellpadding => space between text and line 
 cellspacing => space between two cells  
  to merge the column => colspan 
  to merge the row => rowspan 
 
 -->


 <table border="1" cellpadding="5px" cellspacing="0">

    <tr>
