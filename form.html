<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
   <form>

    <h1>Registration form </h1>
    <fieldset >
        <legend> Registration form </legend>

        <label for="name"> Name : </label>
        <input type="text" placeholder="enter your name"  id="name">

        <br><br>
        <label for="email">Email : </label>
        <input type="email" placeholder="enter your valid email" id="email" >
        <br><br>

        <label for="phone">Phone no : </label>
        <input type="phone" placeholder="1234567890" id="phone">

        <br><br>

        <label for="pass">Password : </label>
        <input type="text" placeholder="******" id="pass" name="password">

        <br><br>

        <label >Gender : </label>
        <label for="male">  
            <input type="radio" name="gender" id="male">
            Male
        </label>

         <label for="female">  
            <input type="radio" name="gender" id="female">
            Female
        </label>

         <label for="other">  
            <input type="radio" name="gender" id="other">
            Other
        </label>

        <br><br>

        <label > Course : </label>

        <label for="mern">
            <input type="checkbox" name="course" id="mern">
            MERN stack 
        </label>

          <label for="java">
            <input type="checkbox" name="course" id="java">
            Java Full stack 
        </label>

          <label for="DSA">
            <input type="checkbox" name="course" id="DSA">
            DSA 
        </label>

          <label for="python">
            <input type="checkbox" name="course" id="python">
           Python 
        </label>









    </fieldset>
   </form> 
</body>
</html>
